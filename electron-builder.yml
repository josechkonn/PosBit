# ============================================================================
# electron-builder configuration for PosBit Desktop
# ============================================================================
# Docs: https://www.electron.build/configuration

appId: com.posbit.app
productName: PosBit
copyright: Copyright © 2026 PosBit

# --- Directorios ---
directories:
  output: dist-electron
  buildResources: resources

# --- Archivos incluidos en el asar ---
files:
  - electron/**/*
  - "!electron/**/*.map"

# --- Recursos extra (fuera del asar, accesibles via process.resourcesPath) ---
extraResources:
  # Next.js standalone server (generado por `next build`)
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      - "!node_modules/.cache/**"

  # Archivos estáticos de Next.js
  - from: .next/static
    to: standalone/.next/static

  # Archivos públicos
  - from: public
    to: standalone/public

  # SQL schema (necesario para init-db)
  - from: sql
    to: standalone/sql

  # Node.js portable (descargado durante el CI/CD)
  - from: resources/node
    to: node

  # PostgreSQL portable (descargado durante el CI/CD)
  - from: resources/postgres
    to: postgres

# --- Compresión ---
asar: true
compression: maximum

# --- Publicación en GitHub Releases ---
publish:
  provider: github
  owner: josechkonn
  repo: PosBit
  releaseType: release

# --- Generación de delta updates ---
generateUpdatesFilesForAllChannels: false

# ============================================================================
# Windows
# ============================================================================
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PosBit
  deleteAppDataOnUninstall: false
  installerLanguages:
    - es_ES
    - en_US
  language: 0x040a  # Español
  # Instalar Visual C++ Redistributable si es necesario
  include: resources/installer.nsh
